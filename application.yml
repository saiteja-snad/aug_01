server:
  port: 8080

spring:
  application:
    name: quickbite-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quickbite_db}
    username: ${DB_USER:quickbite}
    password: ${DB_PASSWORD:quickbite123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:QuickBiteSuperSecretKeyForJWTSigningMustBeAtLeast256BitsLong123456}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}      # 24h
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7d

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: INFO
    com.quickbite: DEBUG
    org.springframework.security: INFO
  file:
    name: logs/quickbite.log
